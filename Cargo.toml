[package]
name = "residue"
version = "0.1.0"
edition = "2021"
description = "lazygit-style TUI for the residue agent worktrees leave behind: servers, strays, worktrees and their databases"

[[bin]]
name = "residue"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
procfs = "0.18"
nix = { version = "0.31", features = ["signal", "user"] }
chrono = "0.4"

[profile.release]
strip = true
lto = true
